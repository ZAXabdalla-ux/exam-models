</style></head><body><a class="dev" href="https://wa.me/201101445926" target="_blank" rel="noopener noreferrer" title="Contact on WhatsApp">Developed by abdallah saleh</a><main class="wrap"><header class="hero"><div>PROBABILITY & STATISTICS • LECTURES 1–4</div><h1>5 Interactive MCQ Exam Models</h1><p>80 different questions • 16 questions per model • 20 marks per model</p></header><nav class="tabs" id="tabs"></nav><div id="exam"></div><section class="dashboard"><h2>Results Dashboard</h2><div class="grid" id="results"></div><h3 id="combined"></h3></section></main><div class="party" id="party"><div id="confetti"></div><div class="partybox"><div style="font-size:65px">🏆🎉</div><h2>Excellent!</h2><p id="partyText"></p><button class="btn" onclick="closeParty()">Continue</button></div></div><script>const MODELS=[[{"q": "For a fair six-sided die, what is P(an even number)?", "o": ["1/6", "1/3", "1/2", "2/3"], "a": 2, "h": "بص يا صاحبي 👌 النواتج الزوجية 2 و4 و6 من أصل 6. لو عاوز تراجعها من المصدر، روح Lecture 1 صفحة 13، هتلاقي الفكرة/القانون هناك.", "m": 1, "tag": ""}, {"q": "If P(A)=2/3, P(B)=4/9, and P(A∩B)=1/4, find P(A∪B).", "o": ["31/36", "5/12", "13/18", "1/4"], "a": 0, "h": "بص يا صاحبي 👌 استخدم P(A∪B)=P(A)+P(B)-P(A∩B). لو عاوز تراجعها من المصدر، روح Lecture 1 صفحة 18، هتلاقي الفكرة/القانون هناك.", "m": 1, "tag": ""}, {"q": "If P(A)=1/3, find P(Aᶜ).", "o": ["1/3", "2/3", "1", "0"], "a": 1, "h": "بص يا صاحبي 👌 المتمم = 1 - P(A). لو عاوز تراجعها من المصدر، روح Lecture 1 صفحة 19، هتلاقي الفكرة/القانون هناك.", "m": 1, "tag": ""}, {"q": "If P(A∩B)=0.18 and P(B)=0.30, find P(A|B).", "o": ["0.06", "0.48", "0.60", "1.67"], "a": 2, "h": "بص يا صاحبي 👌 اقسم P(A∩B) على P(B). لو عاوز تراجعها من المصدر، روح Lecture 2 صفحة 1، هتلاقي الفكرة/القانون هناك.", "m": 1, "tag": ""}, {"q": "A box has 20 fuses, 5 defective. Two are selected without replacement. Find P(both defective).", "o": ["1/19", "1/4", "5/20 × 4/19", "5/20 × 5/20"], "a": 2, "h": "بص يا صاحبي 👌 بدون إرجاع: بعد أول تالف يبقى 4 من 19. لو عاوز تراجعها من المصدر، روح Lecture 2 صفحة 9، هتلاقي الفكرة/القانون هناك.", "m": 1, "tag": ""}, {"q": "If A and B are independent with P(A)=0.5 and P(B)=0.4, find P(A∩B).", "o": ["0.20", "0.45", "0.90", "0.10"], "a": 0, "h": "بص يا صاحبي 👌 للأحداث المستقلة اضرب الاحتمالين. لو عاوز تراجعها من المصدر، روح Lecture 2 صفحة 11، هتلاقي الفكرة/القانون هناك.", "m": 1, "tag": ""}, {"q": "For f(x)=kx, x=0,1,2,3,4,5, find k.", "o": ["1/5", "1/10", "1/15", "1/20"], "a": 2, "h": "بص يا صاحبي 👌 مجموع الاحتمالات = 1، ومجموع x من 0 إلى 5 يساوي 15. لو عاوز تراجعها من المصدر، روح Lecture 3 صفحة 9، هتلاقي الفكرة/القانون هناك.", "m": 1, "tag": ""}, {"q": "For the same f(x)=kx, find P(X≤2).", "o": ["1/15", "2/15", "3/15", "6/15"], "a": 2, "h": "بص يا صاحبي 👌 اجمع f(0)+f(1)+f(2). لو عاوز تراجعها من المصدر، روح Lecture 3 صفحة 12، هتلاقي الفكرة/القانون هناك.", "m": 1, "tag": ""}, {"q": "If E(X)=4, find E(5X+4).", "o": ["20", "24", "40", "9"], "a": 1, "h": "بص يا صاحبي 👌 استخدم E(aX+b)=aE(X)+b. لو عاوز تراجعها من المصدر، روح Lecture 3 صفحة 8، هتلاقي الفكرة/القانون هناك.", "m": 1, "tag": ""}, {"q": "If Var(X)=3, find Var(5X+4).", "o": ["15", "19", "75", "79"], "a": 2, "h": "بص يا صاحبي 👌 استخدم Var(aX+b)=a²Var(X). لو عاوز تراجعها من المصدر، روح Lecture 3 صفحة 8، هتلاقي الفكرة/القانون هناك.", "m": 1, "tag": ""}, {"q": "Which condition must a continuous PDF satisfy?", "o": ["Total integral = 0", "Total integral = 1", "f(x)<0", "E(X)=1"], "a": 1, "h": "بص يا صاحبي 👌 المساحة الكلية تحت دالة الكثافة تساوي 1. لو عاوز تراجعها من المصدر، روح Lecture 4 صفحة 2، هتلاقي الفكرة/القانون هناك.", "m": 1, "tag": ""}, {"q": "If f(x)=2e^(-2x), x≥0, find P(0≤X≤1) approximately.", "o": ["0.1353", "0.8647", "0.5000", "0.9817"], "a": 1, "h": "بص يا صاحبي 👌 كامل من 0 إلى 1 أو استخدم 1-e^-2. لو عاوز تراجعها من المصدر، روح Lecture 4 صفحة 8، هتلاقي الفكرة/القانون هناك.", "m": 1, "tag": ""}, {"q": "Binomial: If n=3, p=0.25, find P(X=2).", "o": ["27/64", "9/64", "3/64", "1/64"], "a": 1, "h": "بص يا صاحبي 👌 استخدم C(3,2)(1/4)^2(3/4). لو عاوز تراجعها من المصدر، روح Lecture 3 صفحة 20، هتلاقي الفكرة/القانون هناك.", "m": 2, "tag": "Binomial"}, {"q": "Binomial: If n=10, p=0.3, find the variance.", "o": ["3", "2.1", "0.3", "7"], "a": 1, "h": "بص يا صاحبي 👌 التباين = np(1-p). لو عاوز تراجعها من المصدر، روح Lecture 3 صفحة 21، هتلاقي الفكرة/القانون هناك.", "m": 2, "tag": "Binomial"}, {"q": "Normal: If μ=100, σ=15, find Z for X=130.", "o": ["1", "1.5", "2", "3"], "a": 2, "h": "بص يا صاحبي 👌 Z=(X-μ)/σ. لو عاوز تراجعها من المصدر، روح Lecture 4 صفحة 24، هتلاقي الفكرة/القانون هناك.", "m": 2, "tag": "Normal"}, {"q": "Normal: Find the area to the left of Z=1.00.", "o": ["0.1587", "0.3413", "0.5000", "0.8413"], "a": 3, "h": "بص يا صاحبي 👌 من جدول Z التراكمي عند 1.00. لو عاوز تراجعها من المصدر، روح Lecture 4 صفحة 32، هتلاقي الفكرة/القانون هناك.", "m": 2, "tag": "Normal"}], [{"q": "A mixture has 6 mints, 4 toffees, and 3 chocolates. Find P(mint).", "o": ["4/13", "6/13", "7/13", "1/2"], "a": 1, "h": "بص يا صاحبي 👌 6 قطع نعناع من إجمالي 13. لو عاوز تراجعها من المصدر، روح Lecture 1 صفحة 14، هتلاقي الفكرة/القانون هناك.", "m": 1, "tag": ""}, {"q": "For the same mixture, find P(toffee or chocolate).", "o": ["3/13", "4/13", "6/13", "7/13"], "a": 3, "h": "بص يا صاحبي 👌 اجمع 4+3 ثم اقسم على 13. لو عاوز تراجعها من المصدر، روح Lecture 1 صفحة 15، هتلاقي الفكرة/القانون هناك.", "m": 1, "tag": ""}, {"q": "If A and B are mutually exclusive, which statement is true?", "o": ["P(A∩B)=1", "P(A∩B)=0", "P(A)=P(B)", "P(A∪B)=0"], "a": 1, "h": "بص يا صاحبي 👌 الحدثان المتنافيان لا يحدثان معًا. لو عاوز تراجعها من المصدر، روح Lecture 1 صفحة 9، هتلاقي الفكرة/القانون هناك.", "m": 1, "tag": ""}, {"q": "If P(A)=0.4 and P(B|A)=0.5, find P(A∩B).", "o": ["0.20", "0.45", "0.80", "0.90"], "a": 0, "h": "بص يا صاحبي 👌 P(A∩B)=P(A)P(B|A). لو عاوز تراجعها من المصدر، روح Lecture 2 صفحة 2، هتلاقي الفكرة/القانون هناك.", "m": 1, "tag": ""}, {"q": "Among 60 occasional smokers, 21 are aged 40–49. Find P(age 40–49 | occasional smoker).", "o": ["21/339", "60/339", "21/60", "60/21"], "a": 2, "h": "بص يا صاحبي 👌 بعد الشرط يصبح فضاء العينة 60. لو عاوز تراجعها من المصدر، روح Lecture 2 صفحة 7، هتلاقي الفكرة/القانون هناك.", "m": 1, "tag": ""}, {"q": "If P(A1)=0.2, P(D|A1)=0.01 and P(D)=0.049, find P(A1|D).", "o": ["0.0020", "0.0408", "0.2000", "0.4900"], "a": 1, "h": "بص يا صاحبي 👌 بايز: (0.2×0.01)/0.049. لو عاوز تراجعها من المصدر، روح Lecture 2 صفحة 16، هتلاقي الفكرة/القانون هناك.", "m": 1, "tag": ""}, {"q": "A discrete random variable takes which type of values?", "o": ["Countable values", "All real values", "Only negative values", "Only fractions"], "a": 0, "h": "بص يا صاحبي 👌 المتغير المتقطع قيمه قابلة للعد. لو عاوز تراجعها من المصدر، روح Lecture 3 صفحة 4، هتلاقي الفكرة/القانون هناك.", "m": 1, "tag": ""}, {"q": "For a discrete probability function, Σf(x) must equal:", "o": ["0", "1", "μ", "σ²"], "a": 1, "h": "بص يا صاحبي 👌 مجموع كل الاحتمالات يساوي 1. لو عاوز تراجعها من المصدر، روح Lecture 3 صفحة 5، هتلاقي الفكرة/القانون هناك.", "m": 1, "tag": ""}, {"q": "X has probabilities 0.1,0.1,0.4,0.3,0.1 for x=1,2,3,4,5. Find P(X≥3).", "o": ["0.2", "0.4", "0.7", "0.8"], "a": 3, "h": "بص يا صاحبي 👌 اجمع احتمالات 3 و4 و5. لو عاوز تراجعها من المصدر، روح Lecture 3 صفحة 6، هتلاقي الفكرة/القانون هناك.", "m": 1, "tag": ""}, {"q": "For the same distribution, find P(X<3).", "o": ["0.1", "0.2", "0.6", "0.8"], "a": 1, "h": "بص يا صاحبي 👌 اجمع احتمالي 1 و2. لو عاوز تراجعها من المصدر، روح Lecture 3 صفحة 6، هتلاقي الفكرة/القانون هناك.", "m": 1, "tag": ""}, {"q": "If f(x)=20000/x³ for x>100, find E(X).", "o": ["2", "100", "200", "20000"], "a": 2, "h": "بص يا صاحبي 👌 اضرب f(x) في x ثم كامل من 100 إلى ∞. لو عاوز تراجعها من المصدر، روح Lecture 4 صفحة 10، هتلاقي الفكرة/القانون هناك.", "m": 1, "tag": ""}, {"q": "For the same density, find E(1/X) approximately.", "o": ["0.000667", "0.006667", "0.06667", "0.667"], "a": 1, "h": "بص يا صاحبي 👌 استخدم g(x)=1/x، فيصبح التكامل 20000/x^4. لو عاوز تراجعها من المصدر، روح Lecture 4 صفحة 1 function show(i){current=i;renderTabs();let M=MODELS[i],st=states[i],e=document.getElementById('exam');e.innerHTML=`<div class="status"><b>Model ${i+1}</b> • Answered: <span id="done">${st.answered.filter(Boolean).length}</span>/16 • Score: <span id="score">${st.score}</span>/20</div><div id="questions"></div><div class="actions"><button class="btn" onclick="show(${Math.max(0,i-1)})">← Previous Model</button><button class="btn" style="background:#7a42c7" onclick="solveAll(${i})">✓ Show All Correct Answers</button><button class="btn finish" onclick="finish(${i})">Finish Model ${i+1}</button>${i<4?`<button class="btn" onclick="show(${i+1})">Next Model →</button>`:`<button class="btn" style="background:#6b35b5" onclick="finishAllModels()">Finish All Models ✓</button>`}</div>`;let root=document.getElementById('questions');M.forEach((x,qi)=>{let d=document.createElement('article');d.className='q '+(x.m===2?'special':'');let opts=x.o.map((z,j)=>`<label class="opt" id="o${i}_${qi}_${j}"><input type="radio" name="q${i}_${qi}" onchange="check(${i},${qi},${j})"> ${z}</label>`).join('');d.innerHTML=`<div class="qh"><span class="badge">Q${qi+1}${x.tag?' • '+x.tag:''}</span><span class="marks">${x.m} mark${x.m>1?'s':''}</span></div><h3>${x.q}</h3><div class="opts">${opts}</div><div id="f${i}_${qi}" class="feedback"></div>`;root.appendChild(d);if(st.answered[qi])d.querySelectorAll('input').forEach(v=>v.disabled=true)});scrollTo({top:0,behavior:'smooth'})}
function check(mi,qi,j){let st=states[mi],x=MODELS[mi][qi];if(st.answered[qi])return;st.answered[qi]=true;document.querySelectorAll(`input[name=q${mi}_${qi}]`).forEach(v=>v.disabled=true);let f=document.getElementById(`f${mi}_${qi}`);if(j===x.a){st.score+=x.m;document.getElementById(`o${mi}_${qi}_${j}`).classList.add('correct');f.className='feedback ok';f.innerHTML=`<b>✓ Correct answer.</b><div class="hint">💡 ${x.h}</div>`}else{document.getElementById(`o${mi}_${qi}_${j}`).classList.add('wrong');document.getElementById(`o${mi}_${qi}_${x.a}`).classList.add('correct');f.className='feedback bad';f.innerHTML=`<b>✗ Wrong answer.</b><br>Correct answer: <b>${x.o[x.a]}</b><div class="hint">💡 تلميح: ${x.h}</div>`}document.getElementById('done').textContent=st.answered.filter(Boolean).length;document.getElementById('score').textContent=st.score}
function solveAll(mi){let st=states[mi];if(!confirm('Show and select all correct answers for this model?'))return;MODELS[mi].forEach((x,qi)=>{st.answered[qi]=true;document.querySelectorAll(`input[name=q${mi}_${qi}]`).forEach((v,j)=>{v.disabled=true;v.checked=(j===x.a)});let good=document.getElementById(`o${mi}_${qi}_${x.a}`);if(good)good.classList.add('correct');let f=document.getElementById(`f${mi}_${qi}`);if(f){f.className='feedback ok';f.innerHTML=`<b>✓ Correct answer: ${x.o[x.a]}</b><div class="hint">💡 تلميح: ${x.h}</div>`}});st.score=20;let d=document.getElementById('done'),sc=document.getElementById('score');if(d)d.textContent=16;if(sc)sc.textContent=20;}
function finish(i){let st=states[i];if(st.answered.filter(Boolean).length<16){alert('Please answer all 16 questions first.');return}let r=JSON.parse(localStorage.getItem('prob80results')||'{}');r[i]={score:st.score,date:new Date().toLocaleString('en-GB')};localStorage.setItem('prob80results',JSON.stringify(r));dashboard();if(st.score>=15)celebrate(i,st.score);else alert(`Model ${i+1}: ${st.score}/20`)}
function dashboard(){let r=JSON.parse(localStorage.getItem('prob80results')||'{}'),g=document.getElementById('results'),sum=0,n=0;g.innerHTML='';for(let i=0;i<5;i++){let x=r[i],d=document.createElement('div');d.className='box';d.innerHTML=x?`<b>Model ${i+1}</b><br><strong>${x.score}/20</strong><br><small>${x.date}</small>`:`<b>Model ${i+1}</b><br>Not completed`;g.appendChild(d);if(x){sum+=x.score;n++}}document.getElementById('combined').textContent=n===5?`Combined result: ${sum}/100`:`Completed: ${n}/5 • Saved total: ${sum}/${n*20}`}
function finishAllModels(){let r=JSON.parse(localStorage.getItem('prob80results')||'{}');let missing=[];for(let i=0;i<5;i++){if(!r[i])missing.push(i+1)}if(missing.length){alert('Please finish these models first: '+missing.join(', '));return;}let sum=0;for(let i=0;i<5;i++)sum+=Number(r[i].score);let pct=sum;let msg=sum>=85?'Excellent overall result!':sum>=75?'Very good overall result!':sum>=60?'Good overall result.':'Review the lectures and try again.';let c=document.getElementById('confetti');c.innerHTML='';document.getElementById('partyText').innerHTML=`Final result for all 5 models:<br><b style="font-size:34px">${sum}/100</b><br>${msg}`;for(let k=0;k<90;k++){let z=document.createElement('i');z.className='conf';z.style.left=Math.random()*100+'%';z.style.background=['#16c5e8','#f4bf3a','#ff4d6d','#5dd39e','#8b5cf6'][k%5];z.style.animationDuration=(2+Math.random()*3)+'s';z.style.animationDelay=(-Math.random()*4)+'s';c.appendChild(z)}document.getElementById('party').classList.add('show');dashboard()}
function celebrate(i,s){let c=document.getElementById('confetti');c.innerHTML='';document.getElementById('partyText').innerHTML=`Model ${i+1}: <b>${s}/20</b>`;for(let k=0;k<70;k++){let z=document.createElement('i');z.className='conf';z.style.left=Math.random()*100+'%';z.style.background=['#16c5e8','#f4bf3a','#ff4d6d','#5dd39e','#8b5cf6'][k%5];z.style.animationDuration=(2+Math.random()*3)+'s';z.style.animationDelay=(-Math.random()*4)+'s';c.appendChild(z)}document.getElementById('party').classList.add('show')}function closeParty(){document.getElementById('party').classList.remove('show')}dashboard();show(0);</script></body></html>
